<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}كرانشي شاورما{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{{ url_for('home') }}">كرانشي شاورما</a>
    <nav aria-label="القائمة الرئيسية">
      <a href="{{ url_for('home') }}" {% if request.endpoint == 'home' %}aria-current="page"{% endif %}>الرئيسية</a>
      <a href="{{ url_for('menu') }}" {% if request.endpoint == 'menu' %}aria-current="page"{% endif %}>المنيو</a>
      <a href="{{ url_for('booking') }}" {% if request.endpoint == 'booking' %}aria-current="page"{% endif %}>حجز طاولة</a>
      <a href="{{ url_for('contact') }}" {% if request.endpoint == 'contact' %}aria-current="page"{% endif %}>تواصل معانا</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p class="footer-brand">كرانشي شاورما</p>
    <p>كل يوم من 12 الظهر لحد 2 بعد نص الليل</p>
    <p>0100 000 0000</p>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
